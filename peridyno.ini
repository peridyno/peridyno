; Peridyno asset and data paths, read from beside the executable when built with
; PERIDYNO_PATHS_FROM_CONFIG=ON. 'asset' feeds getDefaultPath(), 'data' feeds
; getAssetPath(); a key that is absent falls back to a directory of the same name
; beside the executable.
;
;   asset = assets          relative -> resolved against this file's directory
;   asset = C:/my/assets    absolute -> used as-is (no quotes, even with spaces)
;
; ';' or '#' comments only at the start of a line. A line without '=' is ignored.
; Only the first line for a key counts.

asset = assets
data = data
